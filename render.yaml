services:
  - type: web
    name: timtec-catalog-bot
    runtime: static
    buildCommand: mkdir -p catalog && curl -fsSL -o catalog/TimTec_CATALOG_SOURCE.json "https://media.githubusercontent.com/media/TimTecLLC/botproduct/main/catalog/TimTec_CATALOG_SOURCE.json" && test -s catalog/TimTec_CATALOG_SOURCE.json && ls -lh catalog/TimTec_CATALOG_SOURCE.json
    staticPublishPath: .
    headers:
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors *
      - path: /catalog/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
