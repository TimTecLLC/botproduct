<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimTec Catalog Assistant</title>
  <link rel="stylesheet" href="bot.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>TimTec catalog assistant</h1>
      <p>Search by TimTec ID, IUPAC, or SMILES. A01 and A02 are Orlando stock (Yes or No, about 1 business day). A03 is extended overseas stock.</p>
    </header>
    <div id="chat-box" aria-live="polite">
      <div class="row bot"><div class="bubble">Loading the product catalog…</div></div>
    </div>
    <form id="composer">
      <label class="sr-only" for="query">Search</label>
      <input id="query" name="query" autocomplete="off" placeholder="TimTec ID, IUPAC, or SMILES" disabled>
      <button id="search" type="submit" disabled>Search</button>
    </form>
    <address id="contact"></address>
  </div>
  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
  <script src="catalog.js"></script>
  <script src="bot.js"></script>
</body>
</html>
